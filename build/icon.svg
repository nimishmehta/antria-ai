<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Squircle backdrop: deep espresso, subtle warm light from top -->
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#4A3527"/>
      <stop offset="55%" stop-color="#38271D"/>
      <stop offset="100%" stop-color="#2A1C14"/>
    </radialGradient>
    <!-- Brown team nodes -->
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A5636"/>
      <stop offset="100%" stop-color="#6E4126"/>
    </linearGradient>
    <!-- Cream leader node -->
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#EFE6D6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App-icon squircle -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- gentle top sheen -->
  <rect width="1024" height="1024" rx="230" fill="#FFFFFF" opacity="0.04"/>

  <!-- Handoff / coordination lines: two trailing nodes converge into the leader -->
  <g stroke="#F5EFE6" stroke-linecap="round" fill="none" opacity="0.30">
    <path d="M392 372 L604 512" stroke-width="34"/>
    <path d="M392 652 L604 512" stroke-width="34"/>
  </g>

  <!-- Trailing team nodes (brown) -->
  <g filter="url(#soft)">
    <rect x="286" y="278" width="188" height="188" rx="62" fill="url(#node)"/>
    <rect x="286" y="558" width="188" height="188" rx="62" fill="url(#node)"/>
  </g>
  <!-- top edge highlight on brown nodes -->
  <rect x="286" y="278" width="188" height="188" rx="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <rect x="286" y="558" width="188" height="188" rx="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Leader node (cream), forward point of the chevron -->
  <g filter="url(#soft)">
    <rect x="566" y="410" width="204" height="204" rx="66" fill="url(#lead)"/>
  </g>
  <rect x="566" y="410" width="204" height="204" rx="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
</svg>
