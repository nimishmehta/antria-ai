<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Antria app icon: canonical square-in-square mark on warm paper field.
       Colors from Antria design system: paper #FAF8F5, ink #1C1A18, olive #6E7A4E. -->
  <rect width="1024" height="1024" fill="#FAF8F5"/>
  <!-- ink frame (96px band, outer edge 150..874) -->
  <rect x="198" y="198" width="628" height="628" fill="none" stroke="#1C1A18" stroke-width="96"/>
  <!-- centered olive square -->
  <rect x="347" y="347" width="330" height="330" fill="#6E7A4E"/>
</svg>
